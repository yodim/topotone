<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Sound turned into a scrolling landscape." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M0 13 5 6l3 4 3-3 5 6z' fill='%233d4a57'/%3E%3C/svg%3E"
    />
    <title>Topotone</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6f3ec;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Generated landscape"></canvas>
    <noscript>Topotone needs JavaScript to draw the landscape.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
