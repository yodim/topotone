<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Sound turned into a scrolling landscape." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M0 13 5 6l3 4 3-3 5 6z' fill='%233d4a57'/%3E%3C/svg%3E"
    />
    <title>Topotone</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6f3ec;
      }
      #status {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 6px 12px;
        border-radius: 4px;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #2a2f36;
        background: rgba(255, 255, 255, 0.86);
        opacity: 0;
        transition: opacity 0.4s;
        pointer-events: none;
      }
      #status.visible {
        opacity: 1;
      }
      #status.error {
        color: #9b1c1c;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Generated landscape"></canvas>
    <div id="status" role="status" aria-live="polite"></div>
    <input id="file-input" type="file" accept="audio/*" hidden />
    <noscript>Topotone needs JavaScript to draw the landscape.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
