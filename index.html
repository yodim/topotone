<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Sound turned into a scrolling landscape." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M0 13 5 6l3 4 3-3 5 6z' fill='%233d4a57'/%3E%3C/svg%3E"
    />
    <title>Topotone</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6f3ec;
      }
      #status {
        position: fixed;
        left: 50%;
        bottom: 76px;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 6px 12px;
        border-radius: 4px;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #2a2f36;
        background: rgba(255, 255, 255, 0.86);
        opacity: 0;
        transition: opacity 0.4s;
        pointer-events: none;
      }
      #status.visible {
        opacity: 1;
      }
      #status.error {
        color: #9b1c1c;
      }
      #controls {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: flex;
        gap: 8px;
        transition: opacity 0.6s;
      }
      #controls.idle {
        opacity: 0.3;
      }
      #controls button {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid rgba(42, 47, 54, 0.18);
        border-radius: 22px;
        font:
          14px system-ui,
          sans-serif;
        color: #2a2f36;
        background: rgba(255, 255, 255, 0.86);
        cursor: pointer;
      }
      #controls button:hover {
        background: #fff;
      }
      #controls button:focus-visible {
        outline: 2px solid #3d6fb4;
        outline-offset: 2px;
      }
      #controls button[aria-pressed='true'] {
        color: #fff;
        background: #b8322f;
        border-color: #b8322f;
      }
      #controls svg {
        width: 18px;
        height: 18px;
      }
      #tune {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(320px, 85vw);
        overflow-y: auto;
        padding: 12px;
        box-sizing: border-box;
        font:
          12px/1.4 system-ui,
          sans-serif;
        color: #2a2f36;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 1px 0 6px rgba(0, 0, 0, 0.12);
      }
      #tune[hidden] {
        display: none;
      }
      #tune .tune-head {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      #tune .tune-head strong {
        margin-right: auto;
        font-size: 14px;
      }
      #tune button {
        font: inherit;
        padding: 4px 8px;
        border: 1px solid rgba(42, 47, 54, 0.25);
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      #tune p {
        margin: 8px 0;
        color: #5b636e;
      }
      #tune summary {
        margin: 8px 0 4px;
        font-weight: 600;
        cursor: pointer;
      }
      #tune label {
        display: grid;
        grid-template-columns: 96px 1fr 48px;
        gap: 6px;
        align-items: center;
        padding: 1px 4px;
      }
      #tune label.changed {
        background: #fff3cd;
      }
      #tune input {
        width: 100%;
      }
      #tune output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #export {
        position: fixed;
        right: 16px;
        bottom: 76px;
        width: min(300px, calc(100% - 32px));
        box-sizing: border-box;
        padding: 14px;
        border-radius: 8px;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #2a2f36;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      }
      #export[hidden] {
        display: none;
      }
      #export strong {
        font-size: 14px;
      }
      #export p {
        margin: 6px 0 10px;
        color: #5b636e;
      }
      #export label {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 8px;
        align-items: center;
        margin: 6px 0;
      }
      #export label.check {
        display: flex;
      }
      #export select,
      #export input[type='text'] {
        font: inherit;
        padding: 4px 6px;
        border: 1px solid rgba(42, 47, 54, 0.25);
        border-radius: 4px;
        min-width: 0;
      }
      #export .export-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 10px;
      }
      #export button {
        font: inherit;
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid rgba(42, 47, 54, 0.25);
        border-radius: 18px;
        background: #fff;
        cursor: pointer;
      }
      #export button[type='submit'] {
        color: #fff;
        background: #2a2f36;
        border-color: #2a2f36;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Generated landscape"></canvas>
    <div id="status" role="status" aria-live="polite"></div>
    <input id="file-input" type="file" accept="audio/*" hidden />
    <div id="controls">
      <button id="song-button" type="button" title="Play a song (O)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M9 18V5l11-2v13"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <circle cx="6" cy="18" r="3" fill="currentColor" />
          <circle cx="17" cy="16" r="3" fill="currentColor" />
        </svg>
        Song
      </button>
      <button
        id="mic-button"
        type="button"
        title="Listen to the microphone (M)"
        aria-pressed="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" />
          <path
            d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        Mic
      </button>
      <button id="export-button" type="button" title="Export the panorama (E)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 3v12M7 10l5 5 5-5M4 20h16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Export
      </button>
    </div>
    <form id="export" hidden>
      <strong>Export a panorama</strong>
      <p id="export-what"></p>
      <label>
        Height
        <select id="export-height">
          <option value="720">720 px</option>
          <option value="1080" selected>1080 px</option>
          <option value="1440">1440 px</option>
        </select>
      </label>
      <label class="check"><input id="export-caption" type="checkbox" /> Caption strip</label>
      <label>Title <input id="export-title" type="text" maxlength="80" /></label>
      <div class="export-actions">
        <button type="button" id="export-cancel">Cancel</button>
        <button type="submit">Export</button>
      </div>
    </form>
    <noscript>Topotone needs JavaScript to draw the landscape.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
